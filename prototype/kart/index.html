<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kart model — inspection view (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0A0A0A;--panel:#141414;--hot:#E6392B;--gold:#C9A227;--cream:#F5F0E8;--steel:#9AA3A8;
        --disp:'Orbitron',system-ui,sans-serif;--body:'Poppins',system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ink);color:var(--cream);font-family:var(--body);overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas.drag{cursor:grabbing}
  #hud{position:fixed;top:18px;left:22px;pointer-events:none}
  #hud h1{margin:0;font-family:var(--disp);font-weight:900;font-size:1.3rem;letter-spacing:.06em}
  #hud p{margin:4px 0 0;color:var(--steel);font-size:12.5px;max-width:46ch;line-height:1.5}
  #ctl{position:fixed;left:22px;bottom:22px;display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:var(--body);font-size:12.5px;color:var(--cream);background:rgba(20,20,20,.9);
         border:1px solid rgba(154,163,168,.3);padding:9px 14px;cursor:pointer;border-radius:2px}
  button:hover{border-color:var(--gold)}
  button[aria-pressed="true"]{background:var(--hot);border-color:var(--hot)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  #note{position:fixed;right:22px;bottom:22px;color:var(--steel);font-size:11.5px;text-align:right;max-width:34ch;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h1>KART MODEL</h1>
  <p>Procedural geometry traced from <code>wiring.JPG</code>, the testing frames and the
     team's photograph of the bodied car. Drag to orbit, scroll to zoom.</p>
</div>
<div id="ctl">
  <button id="bodyBtn" type="button" aria-pressed="true">Bodywork</button>
  <button id="spinBtn" type="button" aria-pressed="true">Auto-rotate</button>
  <button id="viewSide" type="button">Side</button>
  <button id="viewFront" type="button">Front</button>
  <button id="viewTop" type="button">Top</button>
</div>
<p id="note">A model, not a photograph.<br>Wearing the team's brand mark. The physical car's paint is hand-done and differs.</p>

<script type="module">
import * as THREE from '../trackmap/vendor/three.module.js';
import { buildKart } from '../trackmap/kart.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
const kart = buildKart();
kart.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(kart);
kart.userData.loadLivery('../trackmap/assets/livery-cobra.png');

// Studio environment built procedurally and pre-filtered, so chrome and paint have
// something real to reflect. Without this, metal reads as flat grey plastic.
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x1b1e22);
function softbox(w, h, d, x, y, z, intensity) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(intensity, intensity, intensity) }),
  );
  m.position.set(x, y, z);
  envScene.add(m);
}
softbox(9, 0.1, 9, 0, 6.5, 0, 3.4);      // overhead
softbox(0.1, 5, 7, -6, 3, 0, 1.5);       // left wall
softbox(0.1, 5, 7, 6, 3, 0, 1.1);        // right wall
softbox(7, 5, 0.1, 0, 3, -6.5, 0.55);    // back
scene.environment = pmrem.fromScene(envScene, 0.03).texture;

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshStandardMaterial({ color: 0x0e0e0e, roughness: 0.82, metalness: 0.10 }),
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const key = new THREE.DirectionalLight(0xfff3e4, 2.6);
key.position.set(3.2, 5.5, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5; key.shadow.camera.far = 20;
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0009;
key.shadow.radius = 3;
scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd2f0, 0.35); fill.position.set(-3, 2, 3); scene.add(fill);
const rim = new THREE.DirectionalLight(0xe6392b, 0.9); rim.position.set(-2.5, 1.6, -3.5); scene.add(rim);

const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
const orbit = { az: 0.75, el: 0.42, dist: 5.2 };
const target = { ...orbit };

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let drag = false, lx = 0, ly = 0, spin = true;
canvas.addEventListener('pointerdown', (e) => { drag = true; lx = e.clientX; ly = e.clientY; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  target.az -= (e.clientX - lx) * 0.006;
  target.el = Math.min(1.45, Math.max(-0.15, target.el + (e.clientY - ly) * 0.005));
  lx = e.clientX; ly = e.clientY;
});
canvas.addEventListener('pointerup', (e) => { drag = false; canvas.classList.remove('drag'); try { canvas.releasePointerCapture(e.pointerId); } catch {} });
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  target.dist = Math.min(12, Math.max(2.2, target.dist * Math.exp(e.deltaY * 0.0012)));
}, { passive: false });

const bodyBtn = document.getElementById('bodyBtn');
const spinBtn = document.getElementById('spinBtn');
bodyBtn.addEventListener('click', () => {
  const on = bodyBtn.getAttribute('aria-pressed') !== 'true';
  bodyBtn.setAttribute('aria-pressed', String(on));
  kart.userData.body.visible = on;
});
spinBtn.addEventListener('click', () => {
  spin = spinBtn.getAttribute('aria-pressed') !== 'true';
  spinBtn.setAttribute('aria-pressed', String(spin));
});
const views = { viewSide: [0, 0.10, 4.6], viewFront: [Math.PI / 2, 0.12, 4.4], viewTop: [0.75, 1.40, 5.0] };
Object.entries(views).forEach(([id, [az, el, dist]]) => {
  document.getElementById(id).addEventListener('click', () => {
    Object.assign(target, { az, el, dist });
    spin = false; spinBtn.setAttribute('aria-pressed', 'false');
  });
});

let prev = performance.now();
const samples = [];
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  samples.push(dt * 1000); if (samples.length > 240) samples.shift();
  window.__frameSamples = samples;

  if (spin && !drag) target.az += dt * 0.28;
  const k = 1 - Math.exp(-dt * 8);
  orbit.az += (target.az - orbit.az) * k;
  orbit.el += (target.el - orbit.el) * k;
  orbit.dist += (target.dist - orbit.dist) * k;

  camera.position.set(
    Math.cos(orbit.az) * Math.cos(orbit.el) * orbit.dist,
    Math.sin(orbit.el) * orbit.dist + 0.25,
    Math.sin(orbit.az) * Math.cos(orbit.el) * orbit.dist,
  );
  camera.lookAt(0, 0.42, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
