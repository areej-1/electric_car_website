<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cobra 360 — photoreal locked turntable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a;--panel:#141414;--raised:#1a1a1a;--hot:#e6392b;
    --gold:#c9a227;--cream:#f5f0e8;--steel:#9aa3a8;
    --display:'Orbitron',system-ui,sans-serif;--body:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0}
  body{overflow:hidden;background:var(--ink);color:var(--cream);font-family:var(--body)}
  button{font:inherit}

  .viewer{
    position:relative;width:100%;height:100%;min-height:480px;overflow:hidden;
    background:#0b0b0c;isolation:isolate;touch-action:pan-y;user-select:none;
  }
  /* pan-y on the element that handles the drag, not only on its wrapper:
     touch-action does not inherit, so the stage was computing `auto`.
     Horizontal drags rotate the car; vertical ones belong to the page. */
  .stage{position:absolute;inset:0;display:grid;place-items:center;cursor:grab;touch-action:pan-y}
  .stage.is-dragging{cursor:grabbing}
  .stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,10,10,.18),transparent 24%,transparent 72%,rgba(10,10,10,.68));
    z-index:3;
  }
  .frame{
    position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    opacity:0;transform:scale(var(--zoom,1)) rotate(var(--frame-rotation,0deg));transform-origin:50% 52%;
    transition:transform .12s ease;
    -webkit-user-drag:none;pointer-events:none;
  }
  .frame.is-active{will-change:transform}
  .loading{
    position:absolute;inset:0;display:grid;place-items:center;z-index:8;background:#0b0b0c;
    transition:opacity .35s ease,visibility .35s ease;
  }
  .loading.is-ready{opacity:0;visibility:hidden}
  .loader-mark{
    width:48px;height:48px;border-radius:50%;border:2px solid rgba(154,163,168,.2);
    border-top-color:var(--hot);animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .topbar{
    position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:flex-start;
    justify-content:space-between;gap:20px;padding:20px 22px;pointer-events:none;
  }
  .brand h1{font-family:var(--display);font-size:clamp(1rem,2.5vw,1.35rem);letter-spacing:.08em;margin:0}
  .brand p{font-size:12px;color:var(--steel);margin:5px 0 0}
  .parts{
    display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;max-width:min(560px,60vw);
    pointer-events:auto;   /* the topbar itself is click-through */
  }
  .parts button{
    border:1px solid rgba(154,163,168,.28);background:rgba(20,20,20,.82);color:var(--steel);
    font-size:11px;letter-spacing:.03em;padding:6px 10px;border-radius:2px;cursor:pointer;
    transition:color .16s,border-color .16s,background .16s;
  }
  .parts button:hover{color:var(--cream);border-color:var(--gold);background:var(--raised)}
  .parts button[aria-current="true"]{color:var(--cream);border-color:var(--hot);background:rgba(230,57,43,.18)}
  .parts button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  /* The site's own 44px standard, which these missed at 35px. Keyed on the input
     device rather than the width — this viewer is embedded on tablets too. */
  @media (pointer: coarse){
    .parts button{min-block-size:44px;padding-inline:12px}
  }
  .angle{
    font-family:var(--display);font-size:11px;letter-spacing:.13em;color:var(--gold);
    text-align:right;text-transform:uppercase;
  }
  .angle strong{display:block;color:var(--cream);font-size:14px;margin-top:4px}

  .hint{
    position:absolute;z-index:5;left:50%;bottom:86px;transform:translateX(-50%);
    display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(154,163,168,.2);
    background:rgba(10,10,10,.7);backdrop-filter:blur(8px);font-size:11px;color:var(--steel);
    letter-spacing:.05em;white-space:nowrap;pointer-events:none;transition:opacity .25s ease;
  }
  .viewer.has-dragged .hint{opacity:0}
  .drag-icon{width:28px;height:14px;position:relative}
  .drag-icon::before,.drag-icon::after{content:"";position:absolute;top:6px;width:8px;height:8px;border-top:1px solid var(--cream)}
  .drag-icon::before{left:0;border-left:1px solid var(--cream);transform:rotate(-45deg)}
  .drag-icon::after{right:0;border-right:1px solid var(--cream);transform:rotate(45deg)}
  .drag-icon span{position:absolute;left:5px;right:5px;top:7px;height:1px;background:var(--cream)}

  .controls{
    position:absolute;z-index:6;left:18px;right:18px;bottom:16px;display:flex;
    align-items:center;justify-content:space-between;gap:12px;pointer-events:none;
    /* Wrap rather than overflow. Seven controls need ~350px of intrinsic width; at
       320px the box is 278px, so the zoom buttons were pushed clean outside a
       container that cannot scroll horizontally — unreachable, not just cramped. */
    flex-wrap:wrap;row-gap:8px;
  }
  @media (max-width:400px){
    .controls{justify-content:center}
  }
  .control-group{display:flex;align-items:center;gap:7px;pointer-events:auto}
  .control{
    min-width:42px;height:42px;padding:0 13px;border:1px solid rgba(154,163,168,.28);
    background:rgba(20,20,20,.9);color:var(--cream);cursor:pointer;border-radius:2px;
    transition:border-color .16s,background .16s,transform .16s;
  }
  .control:hover{border-color:var(--gold);background:var(--raised)}
  .control:active{transform:translateY(1px)}
  .control:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .control[aria-pressed="true"]{background:var(--hot);border-color:var(--hot)}
  .control.is-label{font-size:11px;letter-spacing:.04em}

  .hotspots{position:absolute;inset:0;z-index:6;pointer-events:none}
  .hotspot{
    position:absolute;display:flex;align-items:center;gap:9px;border:0;background:transparent;
    color:var(--cream);font-size:11px;letter-spacing:.04em;cursor:pointer;padding:0;
    /* 44px of touch target around a 26px dot, without moving the dot off the part
       it points at: the padding is the hit area and the margin cancels it. */
    padding:9px;margin:-9px;
    transform:translate(-50%,-50%);pointer-events:auto;
    opacity:0;visibility:hidden;transition:opacity .18s ease,visibility .18s ease;
  }
  .hotspot.is-visible{opacity:1;visibility:visible}
  .hotspot .lbl{
    opacity:0;transform:translateX(-4px);transition:opacity .16s,transform .16s;white-space:nowrap;
    background:rgba(10,10,10,.82);padding:5px 8px;border-left:2px solid var(--gold);
  }
  .hotspot:hover .lbl,.hotspot:focus-visible .lbl{opacity:1;transform:none}
  .hotspot-dot{
    width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1px solid var(--gold);
    display:grid;place-items:center;color:var(--cream);background:rgba(10,10,10,.82);
    box-shadow:0 0 0 5px rgba(201,162,39,.16);
  }
  .hotspot:hover .hotspot-dot,.hotspot:focus-visible .hotspot-dot{background:var(--hot);border-color:var(--hot)}
  .hotspot:focus-visible{outline:2px solid var(--gold);outline-offset:4px}

  .detail{
    position:absolute;z-index:7;right:62px;top:50%;width:min(300px,calc(100% - 90px));
    transform:translateY(-50%) translateX(20px);opacity:0;visibility:hidden;
    background:rgba(20,20,20,.95);border:1px solid rgba(201,162,39,.34);
    padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.35);transition:.2s ease;
  }
  .detail.is-open{opacity:1;visibility:visible;transform:translateY(-50%)}
  .detail .eyebrow{font-family:var(--display);font-size:10px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase}
  .detail h2{font-family:var(--display);font-size:1rem;margin:8px 0}
  .detail p{font-size:12px;line-height:1.6;color:var(--steel);margin:0}
  .detail-close{position:absolute;top:8px;right:8px;border:0;background:none;color:var(--steel);font-size:20px;cursor:pointer}

  .disclosure{
    position:absolute;z-index:5;right:18px;bottom:70px;max-width:34ch;text-align:right;
    color:rgba(154,163,168,.78);font-size:10px;line-height:1.5;pointer-events:none;
  }

  @media (max-width:720px){
    .topbar{padding:15px}.brand p{display:none}.angle{display:none}
    .controls{left:10px;right:10px;bottom:10px}.control{height:38px;min-width:38px;padding:0 10px}
    .hotspot .lbl{display:none}
    /* The jump list stays — it is the only way to reach a part whose dot is
       not on screen — but it gets the full width once the hint is hidden. */
    .parts{max-width:none;margin-top:8px}
    .parts button{padding:8px 10px}
    .detail{right:48px}
    /* The disclosure states this is a visualisation rather than a photograph, so it
       must not be hidden on the viewport where most people will see it. Stacked above
       the controls with the drag hint above it, so the three never overlap. */
    .disclosure{
      left:10px;right:10px;bottom:56px;max-width:none;text-align:center;font-size:9.5px;
    }
    .hint{bottom:104px}
  }
  @media (prefers-reduced-motion:reduce){
    .frame,.loading,.detail{transition:none}.loader-mark{animation:none}
  }
</style>
</head>
<body>
<main class="viewer" id="viewer" aria-label="Interactive 360-degree view of the Cobras race car">
  <div class="loading" id="loading" aria-live="polite">
    <div class="loader-mark" aria-hidden="true"></div>
  </div>

  <div class="stage" id="stage" tabindex="0" aria-label="Drag horizontally to rotate and vertically to tilt up. Use arrow keys to change angle.">
    <!-- AVIF with a JPEG fallback, same as the generated frames. data-src rather
         than src because nothing shows this frame until the reader tilts all the
         way up, so it belongs in the last loading wave, not competing with the
         angles on screen. -->
    <img class="frame top-frame" data-src="../../assets/car-turntable-smooth-nose/top.avif"
         onerror="this.onerror=null;this.src='../../assets/car-turntable-smooth-nose/top.jpg'"
         alt="Directly overhead view of the Cobras electric race car" draggable="false">
  </div>

  <header class="topbar">
    <div class="brand">
      <h1>COBRA 360</h1>
      <p>Drag sideways to rotate · drag upward for top view · ctrl or ⌘ + scroll to zoom</p>
      <!-- Jump to a part from here regardless of where the car is pointing. The
           dots only exist within a frame of their own angle, so on eleven of the
           thirty-two views there is nothing on the car to click; this list is
           always present and is the same eight destinations. Built by the script
           from the same data, so the two can never disagree. -->
      <nav class="parts" id="parts" aria-label="Jump to a part"></nav>
    </div>
    <div class="angle">Camera angle<strong id="angleLabel">Front</strong></div>
  </header>

  <div class="hint" aria-hidden="true">
    <span class="drag-icon"><span></span></span>
    Drag in any direction
  </div>

  <!-- Dots sit on the car, not in a list beside it. Each one is pinned to a point
       on a specific frame, so it is only shown when the viewer is actually looking
       at the angle where that part is visible — a dot over a body panel that hides
       the part it names would be worse than no dot. Built by the script below. -->
  <div class="hotspots" id="hotspots" aria-label="Car details"></div>

  <aside class="detail" id="detail" aria-live="polite">
    <button class="detail-close" type="button" aria-label="Close detail">×</button>
    <div class="eyebrow">Component detail</div>
    <h2 id="detailTitle"></h2>
    <p id="detailBody"></p>
  </aside>

  <div class="controls">
    <div class="control-group">
      <button class="control is-label" id="spinBtn" type="button" aria-pressed="false">Auto rotate</button>
      <button class="control" id="prevBtn" type="button" aria-label="Previous angle">←</button>
      <button class="control" id="nextBtn" type="button" aria-label="Next angle">→</button>
      <button class="control is-label" id="eyeBtn" type="button">Eye level</button>
      <button class="control is-label" id="topBtn" type="button">Top</button>
    </div>
    <div class="control-group">
      <button class="control" id="zoomOut" type="button" aria-label="Zoom out">−</button>
      <button class="control" id="zoomIn" type="button" aria-label="Zoom in">+</button>
    </div>
  </div>

  <p class="disclosure">AI-assisted studio visualization locked to one master design: two five-spoke front wheels and one centered rear wheel fully enclosed by the shell.</p>
</main>

<script>
(() => {
  /* ---------- Arabic ----------
     This viewer runs in its own document inside an iframe, so the site's
     translator never reaches it: a TreeWalker over the parent stops at the frame
     boundary. Even reaching in would not be enough — the angle readout and the
     frame alt text are rebuilt on every drag, so anything swapped in once gets
     overwritten by the first pointer move. The strings have to come from here.

     Language comes from the embedding page when there is one, and from ?lang=ar
     when this file is opened on its own. Both are read, so the prototype stays
     usable standalone. */
  const LANG = (() => {
    const q = new URLSearchParams(location.search).get('lang');
    if (q) return q.startsWith('ar') ? 'ar' : 'en';
    // localStorage first, and deliberately: it is the parent's own source of
    // truth for language and it is readable the instant this script runs.
    // Reading parent.document.documentElement.lang instead would be a race —
    // site.js sits at the end of the parent's body and sets that attribute, but
    // this frame can start parsing before it gets there, and the viewer would
    // render English on an Arabic page depending on network timing.
    try {
      const stored = localStorage.getItem('cobras_lang');
      if (stored) return stored.startsWith('ar') ? 'ar' : 'en';
    } catch (error) { /* storage blocked: fall through */ }
    try {
      if (parent !== window && parent.document.documentElement.lang.startsWith('ar')) return 'ar';
    } catch (error) { /* cross-origin embed: fall through to the default */ }
    return document.documentElement.lang.startsWith('ar') ? 'ar' : 'en';
  })();
  const AR = {
    // Camera positions, as read out beside the angle.
    'Front':'أمامي','Front left':'أمامي يسار','Left front':'يسار أمامي','Left side':'جانبي أيسر',
    'Left rear':'يسار خلفي','Rear left':'خلفي يسار','Rear':'خلفي','Rear right':'خلفي يمين',
    'Right rear':'يمين خلفي','Right side':'جانبي أيمن','Right front':'يمين أمامي','Front right':'أمامي يمين',
    'Eye level':'مستوى النظر','Elevated':'مرتفع','Top':'علوي',
    // The same three elevations again, in the form the alt sentence needs them.
    'alt.Eye-level':'من مستوى النظر','alt.Elevated':'من زاوية مرتفعة','alt.Top':'من الأعلى',
    'alt.frame':'منظر {direction} {elevation} لسيارة سباق كوبرا الكهربائية عند {angle} درجة',
    'alt.top':'منظر علوي مباشر لسيارة سباق كوبرا الكهربائية',
    'stage.aria':'سيارة كوبرا عند {angle}، {elevation}. اسحب أفقيًا للتدوير.',
    'viewer.aria':'عرض تفاعلي بزاوية 360 درجة لسيارة سباق كوبرا',
    'stage.start':'اسحب أفقيًا للتدوير وعموديًا للإمالة للأعلى. استخدم مفاتيح الأسهم لتغيير الزاوية.',
    'brand.hint':'اسحب أفقيًا للتدوير · اسحب للأعلى للمنظر العلوي · ctrl أو ⌘ مع التمرير للتقريب',
    'Camera angle':'زاوية الكاميرا','Drag in any direction':'اسحب في أي اتجاه',
    'Component detail':'تفاصيل المكوّن','Auto rotate':'دوران تلقائي',
    'Car details':'تفاصيل السيارة','Close detail':'إغلاق التفاصيل',
    'Previous angle':'الزاوية السابقة','Next angle':'الزاوية التالية',
    'Zoom out':'تصغير','Zoom in':'تكبير',
    'Cockpit':'المقصورة','Front axle':'المحور الأمامي','Rear shell':'المؤخرة',
    'disclosure':'تصوّر استوديو بمساعدة الذكاء الاصطناعي، مثبّت على تصميم رئيسي واحد: عجلتان أماميتان بخمس أذرع، وعجلة خلفية واحدة في المنتصف يغطيها الهيكل بالكامل.'
  };
  const t = (key, fallback) => (LANG === 'ar' && AR[key]) || fallback || key;

  /* The zoom hint names a key, and which key it is depends on the machine.
     ⌘ does not exist on a Windows keyboard and renders as a symbol nobody there
     can press; Ctrl exists on a Mac but ctrl+wheel is the system zoom gesture,
     so telling a Mac reader to use it is worse than saying nothing. The handler
     accepts both either way — this only fixes what the label claims. */
  const APPLE = /Mac|iPhone|iPad|iPod/.test(navigator.platform || '')
    || /Mac OS X/.test(navigator.userAgent);
  const zoomKey = (text) => text
    .replace('ctrl or ⌘', APPLE ? '⌘' : 'Ctrl')
    .replace('ctrl أو ⌘', APPLE ? '⌘' : 'Ctrl');
  const fill = (template, values) =>
    Object.keys(values).reduce((out, k) => out.split(`{${k}}`).join(values[k]), template);

  const viewer = document.getElementById('viewer');
  const stage = document.getElementById('stage');
  const topFrame = document.querySelector('.top-frame');
  const frameSuffixes = [
    '000','011','023','034','045','056','068','079',
    '090','101','113','124','135','146','158','169',
    '180','191','203','214','225','236','248','259',
    '270','281','293','304','315','326','338','349'
  ];
  const frameAssetVersion = 'livery-v5';
  const labels = [
    'Front','Front left','Front left','Front left',
    'Front left','Left front','Left front','Left front',
    'Left side','Left rear','Left rear','Left rear',
    'Rear left','Rear left','Rear left','Rear left',
    'Rear','Rear right','Rear right','Rear right',
    'Rear right','Right rear','Right rear','Right rear',
    'Right side','Right front','Right front','Right front',
    'Front right','Front right','Front right','Front right'
  ];
  const angleStep = 360 / frameSuffixes.length;
  frameSuffixes.forEach((suffix, index) => {
    const angle = index * angleStep;
    [
      {prefix:'eye', className:'ring-low', elevation:'Eye-level'},
      {prefix:'elevated', className:'ring-high', elevation:'Elevated'}
    ].forEach(({prefix, className, elevation}) => {
      const image = document.createElement('img');
      image.className = `frame ${className}`;
      image.dataset.index = String(index);
      image.dataset.angle = String(angle);
      /* AVIF, with the original JPEG behind it. The same 65 frames are 18.6 MB as
         JPEG and 1.9 MB as AVIF at visually identical quality — the backdrop is
         a smooth studio gradient and the car is flat colour, which is close to
         the best case for a modern codec.

         The fallback is per-image onerror rather than a capability probe because
         there is no reliable synchronous test for AVIF *decoding* — the canvas
         trick tests encoding — and an async probe would have to gate frame
         creation, which everything below assumes has already happened. A browser
         too old for AVIF (iOS before 16.4) pays one failed request per frame and
         still gets the viewer; every current browser fetches once.

         The URL is parked on the element rather than assigned. Setting src here
         would start all 65 downloads at once, and a browser runs six at a time in
         roughly the order they were created — so the handful of angles the viewer
         actually needs to open would sit in a queue behind sixty it does not, and
         the loading overlay would last as long as the whole set. They are
         assigned in waves further down instead. */
      image.dataset.src = `../../assets/car-turntable-smooth-nose/${prefix}-${suffix}.avif?v=${frameAssetVersion}`;
      image.dataset.fallback = `../../assets/car-turntable-smooth-nose/${prefix}-${suffix}.jpg?v=${frameAssetVersion}`;
      image.addEventListener('error', function fallback() {
        this.removeEventListener('error', fallback);
        this.src = this.dataset.fallback;
      });
      image.alt = LANG === 'ar'
        ? fill(t('alt.frame'), { direction: t(labels[index]), elevation: t(`alt.${elevation}`), angle })
        : `${elevation} ${labels[index].toLowerCase()} view of the Cobras electric race car at ${angle} degrees`;
      image.draggable = false;
      image.decoding = 'async';
      image.setAttribute('aria-hidden', 'true');
      stage.insertBefore(image, topFrame);
    });
  });
  const frames = [...document.querySelectorAll('.frame')];
  const lowFrames = [...document.querySelectorAll('.ring-low')];
  const highFrames = [...document.querySelectorAll('.ring-high')];
  const loading = document.getElementById('loading');
  const angleLabel = document.getElementById('angleLabel');
  const spinBtn = document.getElementById('spinBtn');
  const detail = document.getElementById('detail');
  const detailTitle = document.getElementById('detailTitle');
  const detailBody = document.getElementById('detailBody');
  const details = LANG === 'ar' ? {
    cockpit:['مقصورة مكشوفة','مقعد مجوّف أسود، وحزام أمان رباعي أحمر زاهٍ، وهيكل حماية أنبوبي، وتوجيه بمقود.'],
    axle:['محور أمامي واحد','عجلتان أماميتان من الكروم بخمس أذرع، مركّبتان جنبًا إلى جنب على محور واحد مشترك.'],
    shell:['مؤخرة مغلقة','العجلة الخلفية الوحيدة في المنتصف تقع داخل الذيل المركّب المتصل ولا تظهر من الخارج.'],
    brakes:['المكابح','يُفحص شدّ التوجيه والمكابح والعجلات والمقعد والمثبّتات قبل كل تشغيل.'],
    chassis:['الهيكل','يُجمَّع الهيكل والتوجيه والمقعد والعجلات وأدوات التحكم في سيارة واحدة عاملة.'],
    killSwitch:['مفتاح الإيقاف','جزء من نظام 48 فولت، إلى جانب البطاريات ووحدة التحكم والمحرك ومدخلات السائق. جرى فحصه وإعادة عنونته في سجل الورشة بتاريخ 1 يوليو 2026.'],
    motor:['المحرك','يعمل من نظام 48 فولت. العجلة الخلفية الوحيدة التي يديرها تقع في منتصف الذيل.'],
    controller:['وحدة التحكم','تقع بين البطارية والمحرك ضمن نظام 48 فولت.']
  } : {
    cockpit:['Open cockpit','Black bucket seat, bright red four-point harness, tubular roll structure, and handlebar steering.'],
    axle:['Single front axle','Two chrome five-spoke front wheels mounted side-by-side across one common axle.'],
    shell:['Enclosed rear shell','The single centered rear wheel sits inside the continuous composite tail and is hidden externally.'],
    /* Every line below is taken from something the site already states — the
       workshop log, the build stages, or the 101 page. Nothing here is a figure
       invented to fill a panel. */
    brakes:['Brakes','Steering, brakes, wheels, seat and fasteners are torque-checked before a run.'],
    chassis:['Chassis','The frame, steering, seat, wheels and controls are assembled into one working machine.'],
    killSwitch:['Kill switch','Part of the 48V system, alongside the batteries, controller, motor and driver inputs. Checked and re-labelled in the 1 July 2026 workshop log.'],
    motor:['Motor','Driven from the 48V system. The single rear wheel it turns sits centred inside the tail.'],
    controller:['Controller','Sits between the battery and the motor on the 48V system.']
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let zoom = 1;
  let dragging = false;
  let startX = 0;
  let startY = 0;
  let startAzimuth = 0;
  let startTilt = 0;
  // Opens on frame 5 (56.25°, left front) rather than dead front. Two reasons:
  // it is the three-quarter view that reads as a car rather than a silhouette,
  // and it is an anchor — so a first-time reader arrives with a hotspot already
  // on screen instead of having to rotate before discovering the feature exists.
  let azimuth = 5;
  let targetAzimuth = 5;
  let tilt = 0;
  let targetTilt = 0;
  let autoRotate = false;
  let previousTime = performance.now();
  let activeFrame = null;
  let renderedIndex = -1;
  let renderedElevation = '';

  const normalizeAngle = (value) => {
    let result = value % lowFrames.length;
    if (result < 0) result += lowFrames.length;
    return result;
  };
  const formatDegrees = (value) => {
    const precise = value.toFixed(2).replace(/\.?0+$/, '');
    const [whole, fraction] = precise.split('.');
    return `${whole.padStart(3, '0')}${fraction ? `.${fraction}` : ''}°`;
  };
  const setActiveFrame = (nextFrame) => {
    if (activeFrame === nextFrame) return;
    // Hold the frame we have rather than cut to one that has not arrived. The
    // viewer becomes usable after a coarse subset of angles has loaded, so a
    // fast drag can reach an angle that is still in flight; switching to it
    // would blank the stage mid-rotation. Staying put makes that read as a
    // slightly chunky rotation instead, and the next frame corrects it.
    if (!nextFrame.complete || nextFrame.naturalWidth === 0) return;
    if (activeFrame) {
      activeFrame.style.opacity = '0';
      activeFrame.classList.remove('is-active');
      activeFrame.setAttribute('aria-hidden', 'true');
    }
    nextFrame.style.opacity = '1';
    nextFrame.classList.add('is-active');
    nextFrame.setAttribute('aria-hidden', 'false');
    activeFrame = nextFrame;
  };
  topFrame.dataset.angle = 'overhead';
  topFrame.setAttribute('aria-hidden', 'true');
  const renderView = () => {
    const wrapped = normalizeAngle(azimuth);
    const nearest = Math.round(wrapped) % lowFrames.length;
    const showTop = tilt >= .82;
    const showHigh = !showTop && tilt >= .34;
    const nextFrame = showTop ? topFrame : showHigh ? highFrames[nearest] : lowFrames[nearest];
    setActiveFrame(nextFrame);
    const imageAngle = nearest * angleStep;
    const elevation = showTop ? 'Top' : showHigh ? 'Elevated' : 'Eye level';
    if (nearest !== renderedIndex || elevation !== renderedElevation) {
      topFrame.style.setProperty('--frame-rotation', `${imageAngle}deg`);
      const angleText = formatDegrees(imageAngle);
      angleLabel.textContent = `${angleText} · ${t(labels[nearest])} · ${t(elevation)}`;
      stage.setAttribute('aria-label', LANG === 'ar'
        ? fill(t('stage.aria'), { angle: angleText, elevation: t(elevation) })
        : `Cobras car at ${angleText}, ${elevation}. Drag sideways to rotate.`);
      renderedIndex = nearest;
      renderedElevation = elevation;
      revealHotspots(nearest, elevation);
    }
  };
  const applyZoom = (next) => {
    zoom = Math.max(1, Math.min(1.9, next));
    viewer.style.setProperty('--zoom', zoom.toFixed(2));
    placeHotspots();   // the dots scale about the same origin as the frames
  };
  const stopAuto = () => {
    autoRotate = false;
    spinBtn.setAttribute('aria-pressed', 'false');
  };
  const startAuto = () => {
    if (reduced) return;
    autoRotate = true;
    spinBtn.setAttribute('aria-pressed', 'true');
  };

  /* Open on a coarse ring rather than the whole turntable.

     This used to wait on all 65 frames before clearing the loading overlay, so
     the page was a spinner until the last byte of the set had arrived — the
     reader could not touch a car that was already on screen behind it. Every
     eighth eye-level angle is enough to rotate through a full 360°, and it is a
     small fraction of the set, so the viewer becomes usable almost immediately
     and sharpens as the remaining angles land. setActiveFrame holds the last
     good frame in the meantime, so a fast early drag steps rather than blanks.

     "Settled" deliberately means loaded-or-given-up, not loaded-or-errored. The
     first error on a frame is the expected one on a browser without AVIF, and it
     is immediately followed by the JPEG retry — resolving there would clear the
     overlay off a stage that has nothing on it yet, since setActiveFrame will
     not show an unloaded frame. So it waits out the retry and only gives up when
     the fallback fails too.

     And it gives up on a clock regardless. A frame that neither loads nor errors
     — a stalled connection, a proxy holding the socket — would otherwise pin the
     overlay over a viewer that may well be usable. */
  const settled = (img) => (img.complete && img.naturalWidth > 0) ? Promise.resolve() : new Promise((resolve) => {
    let failures = 0;
    const finish = () => {
      img.removeEventListener('load', finish);
      img.removeEventListener('error', onError);
      resolve();
    };
    const onError = () => { if (++failures >= 2) finish(); };
    img.addEventListener('load', finish);
    img.addEventListener('error', onError);
  });
  const request = (img) => { if (img.dataset.src) { img.src = img.dataset.src; delete img.dataset.src; } };

  /* Three waves, in the order the viewer needs them.

     Opening: every eighth angle at eye level. Enough to turn the car through a
     full circle, and small enough to arrive almost at once. The overlay lifts
     here.

     Then the rest of the eye-level ring, which is what a reader is looking at
     while they first drag, and only then the elevated ring and the overhead
     frame, which nothing shows until they tilt up.

     Each wave waits for the one before rather than firing on a timer, so on a
     fast connection all three land in quick succession and on a slow one the
     later waves never compete with the frames being looked at. */
  const opening = lowFrames.filter((_, index) => index % 8 === 0);
  const rest = [...lowFrames.filter((f) => !opening.includes(f)), ...highFrames, topFrame];

  const reveal = () => loading.classList.add('is-ready');
  opening.forEach(request);
  Promise.all(opening.map(settled)).then(() => {
    reveal();
    rest.forEach(request);
  });
  // The overlay never outlives this, whatever the network is doing. Frames that
  // have not arrived are simply not switched to, so a partly-loaded turntable is
  // usable rather than hidden.
  setTimeout(reveal, 8000);

  stage.addEventListener('pointerdown', (event) => {
    dragging = true;startX = event.clientX;startY = event.clientY;
    startAzimuth = targetAzimuth;startTilt = targetTilt;
    stage.classList.add('is-dragging');stage.setPointerCapture(event.pointerId);stopAuto();
  });
  stage.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    targetAzimuth = startAzimuth - (event.clientX - startX) / 23;
    targetTilt = Math.max(0, Math.min(1, startTilt - (event.clientY - startY) / 280));
    viewer.classList.add('has-dragged');
  });
  const finishDrag = (event) => {
    if (!dragging) return;
    dragging = false;stage.classList.remove('is-dragging');
    try{stage.releasePointerCapture(event.pointerId)}catch{}
    if (Math.hypot(event.clientX - startX,event.clientY - startY) > 4) viewer.classList.add('has-dragged');
  };
  stage.addEventListener('pointerup', finishDrag);
  stage.addEventListener('pointercancel', finishDrag);
  // Zoom only with a modifier. This runs inside an iframe on trackmap.html and
  // car.html, so cancelling every wheel event does not merely stop this element
  // scrolling — it stops the PARENT page scrolling too, with no way out but to
  // move the pointer off the frame. ctrlKey also covers the trackpad pinch
  // gesture, which browsers report as ctrl+wheel, so pinch still zooms.
  stage.addEventListener('wheel', (event) => {
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();applyZoom(zoom * Math.exp(-event.deltaY * .001));stopAuto();
  }, {passive:false});
  stage.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') {event.preventDefault();targetAzimuth -= 1;stopAuto()}
    if (event.key === 'ArrowRight') {event.preventDefault();targetAzimuth += 1;stopAuto()}
    if (event.key === 'ArrowUp') {event.preventDefault();targetTilt = Math.min(1,targetTilt + .25);stopAuto()}
    if (event.key === 'ArrowDown') {event.preventDefault();targetTilt = Math.max(0,targetTilt - .25);stopAuto()}
    if (event.key === '+' || event.key === '=') {event.preventDefault();applyZoom(zoom + .1)}
    if (event.key === '-') {event.preventDefault();applyZoom(zoom - .1)}
  });

  document.getElementById('prevBtn').addEventListener('click', () => {targetAzimuth -= 1;stopAuto()});
  document.getElementById('nextBtn').addEventListener('click', () => {targetAzimuth += 1;stopAuto()});
  document.getElementById('eyeBtn').addEventListener('click', () => {targetTilt = 0;stopAuto()});
  document.getElementById('topBtn').addEventListener('click', () => {targetTilt = 1;stopAuto()});
  document.getElementById('zoomIn').addEventListener('click', () => applyZoom(zoom + .12));
  document.getElementById('zoomOut').addEventListener('click', () => applyZoom(zoom - .12));
  spinBtn.addEventListener('click', () => autoRotate ? stopAuto() : startAuto());

  /* ---------- hotspots ----------
     Each one is a point on a specific frame, given as a fraction of the frame
     image rather than of the viewer, because the frame is letterboxed inside the
     viewer by object-fit: contain and moves under zoom. Positions were read off
     the frames themselves.

     A dot only appears while the viewer is within a frame or so of its angle. A
     dot pinned to the near front wheel is meaningless — and misleading — once the
     car has rotated so that wheel is on the far side or behind bodywork. */
  const HOTSPOTS = [
    { id:'cockpit',    n:1, frame:4,  x:0.680, y:0.330 },
    { id:'axle',       n:2, frame:28, x:0.556, y:0.602 },
    { id:'shell',      n:3, frame:12, x:0.725, y:0.567 },
    { id:'brakes',     n:4, frame:5,  x:0.478, y:0.622 },
    { id:'chassis',    n:5, frame:7,  x:0.440, y:0.445 },
    { id:'killSwitch', n:6, frame:10, x:0.620, y:0.410 },
    { id:'motor',      n:7, frame:16, x:0.487, y:0.382 },
    { id:'controller', n:8, frame:21, x:0.400, y:0.360 },
  ];
  const hotspotLayer = document.getElementById('hotspots');
  const FRAME_W = 1536, FRAME_H = 1024;   // intrinsic size of every turntable frame
  // ±1 frame, and no wider. Each dot's x/y was read off one specific frame, so it
  // is only in the right place at that angle: opened up to ±4 the chassis dot
  // drifted off the frame rails and onto the nose decal, which is worse than not
  // showing it. The cost is that twelve of the thirty-two angles name no part —
  // honest, since those views have no anchored part facing the camera — and it is
  // why the viewer now opens on an anchor instead of dead front.
  const SPOT_TOLERANCE = 1;

  // One action, two ways in: the dot on the car and the named button under the
  // title. Both call this, so they cannot drift apart.
  function focusPart(h) {
    stopAuto();
    targetAzimuth = h.frame;
    targetTilt = .26;
    const [title, body] = details[h.id];
    detailTitle.textContent = title;
    detailBody.textContent = body;
    detail.classList.add('is-open');
  }

  const partsNav = document.getElementById('parts');

  const spots = HOTSPOTS.map((h) => {
    const [label] = details[h.id];

    const button = document.createElement('button');
    button.className = 'hotspot';
    button.type = 'button';
    button.innerHTML = `<span class="hotspot-dot">${h.n}</span><span class="lbl"></span>`;
    button.querySelector('.lbl').textContent = label;
    button.setAttribute('aria-label', label);
    button.addEventListener('click', () => focusPart(h));
    hotspotLayer.appendChild(button);

    // The same destination, always reachable. The dot only exists near its own
    // angle; this does not.
    const jump = document.createElement('button');
    jump.type = 'button';
    jump.textContent = label;
    jump.addEventListener('click', () => focusPart(h));
    partsNav.appendChild(jump);

    return { ...h, button, jump };
  });

  // Where the frame image actually paints, and where a point on it lands after
  // the stage's zoom. object-fit: contain letterboxes on one axis; the zoom is a
  // scale about 50% 52%, the same origin the frames use.
  function placeHotspots() {
    const box = stage.getBoundingClientRect();
    if (!box.width || !box.height) return;
    const fit = Math.min(box.width / FRAME_W, box.height / FRAME_H);
    const paintedW = FRAME_W * fit;
    const paintedH = FRAME_H * fit;
    const originX = box.width / 2;
    const originY = box.height * 0.52;
    const left = (box.width - paintedW) / 2;
    const top = (box.height - paintedH) / 2;
    for (const spot of spots) {
      const x = left + spot.x * paintedW;
      const y = top + spot.y * paintedH;
      spot.button.style.left = `${(originX + (x - originX) * zoom).toFixed(1)}px`;
      spot.button.style.top = `${(originY + (y - originY) * zoom).toFixed(1)}px`;
    }
  }

  // Visible only near its own angle, and only at eye level — the positions were
  // read off the eye-level ring, and the elevated and overhead frames show the
  // car from somewhere those points do not correspond to.
  function revealHotspots(index, elevation) {
    const count = lowFrames.length;
    for (const spot of spots) {
      const delta = Math.min((index - spot.frame + count) % count, (spot.frame - index + count) % count);
      const near = delta <= SPOT_TOLERANCE && elevation === 'Eye level';
      spot.button.classList.toggle('is-visible', near);
      spot.button.tabIndex = near ? 0 : -1;
      spot.button.setAttribute('aria-hidden', near ? 'false' : 'true');
      spot.jump.setAttribute('aria-current', near ? 'true' : 'false');
    }
  }
  addEventListener('resize', placeHotspots, { passive: true });
  placeHotspots();
  revealHotspots(renderedIndex, renderedElevation);
  document.querySelector('.detail-close').addEventListener('click', () => detail.classList.remove('is-open'));
  addEventListener('keydown', (event) => {if(event.key === 'Escape') detail.classList.remove('is-open')});

  /* The static chrome, done once. Everything above this point is either rebuilt
     per frame or read on demand; these are the nodes that are written in the
     markup and never touched again, so a single pass at startup is enough.
     dir/lang go on <html> so Arabic lays out right-to-left inside the frame
     while the stage transforms — which are computed in screen space — stay put. */
  if (LANG === 'ar') {
    document.documentElement.lang = 'ar';
    document.documentElement.dir = 'rtl';
    const set = (selector, value, attribute) => {
      const node = document.querySelector(selector);
      if (!node) return;
      if (attribute) node.setAttribute(attribute, value); else node.textContent = value;
    };
    set('.brand p', t('brand.hint'));
    set('.hotspots', t('Car details'), 'aria-label');
    set('.detail-close', t('Close detail'), 'aria-label');
    set('.detail .eyebrow', t('Component detail'));
    set('#spinBtn', t('Auto rotate'));
    set('#prevBtn', t('Previous angle'), 'aria-label');
    set('#nextBtn', t('Next angle'), 'aria-label');
    set('#eyeBtn', t('Eye level'));
    set('#topBtn', t('Top'));
    set('#zoomOut', t('Zoom out'), 'aria-label');
    set('#zoomIn', t('Zoom in'), 'aria-label');
    set('.disclosure', t('disclosure'));
    set('#viewer', t('viewer.aria'), 'aria-label');
    set('.top-frame', t('alt.top'), 'alt');
    // Both of these hold a bare text node alongside an element child, so they
    // need the text node itself — textContent would delete the sibling.
    viewer.querySelector('.hint').childNodes.forEach((node) => {
      if (node.nodeType === 3 && node.nodeValue.trim()) node.nodeValue = t('Drag in any direction');
    });
    viewer.querySelector('.angle').childNodes.forEach((node) => {
      if (node.nodeType === 3 && node.nodeValue.trim()) node.nodeValue = t('Camera angle');
    });
    document.querySelectorAll('.hotspot span:first-child').forEach((node) => {
      node.textContent = t(node.textContent.trim());
    });
    // The stage's aria-label is replaced on the first renderView; this covers the
    // moment before that, when a screen reader could already have reached it.
    stage.setAttribute('aria-label', t('stage.start'));
  }

  // After the Arabic pass, not inside it: the hint names a key in both
  // languages, and the English one is written in the markup rather than set
  // above, so this has to run either way.
  const brandHint = document.querySelector('.brand p');
  if (brandHint) brandHint.textContent = zoomKey(brandHint.textContent);

  const animate = (now) => {
    const delta = Math.min(.05,(now - previousTime) / 1000);previousTime = now;
    if (autoRotate && !dragging) targetAzimuth += delta * (27.9 / angleStep);
    const smoothing = reduced ? 1 : 1 - Math.exp(-delta * 12);
    azimuth += (targetAzimuth - azimuth) * smoothing;
    tilt += (targetTilt - tilt) * smoothing;
    renderView();
    requestAnimationFrame(animate);
  };
  renderView();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
